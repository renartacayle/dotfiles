# ==============================================================================
# Tmux Modular Configuration
# ==============================================================================

# Ubah prefix dari C-b ke C-a (lebih ergonomis)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config dengan r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux Config Reloaded!"

# Aktifkan true color 24-bit & mouse support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# Indeks window & pane mulai dari 1 (bukan 0, lebih mudah dijangkau keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split window di direktori saat ini
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigasi pane bergaya Vim (h, j, k, l)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize pane dengan Prefix + H, J, K, L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mode copy bergaya vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# ==============================================================================
# List of Plugins (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Inisialisasi TMUX plugin manager (letakkan di baris paling bawah)
run '~/.tmux/plugins/tpm/tpm'
